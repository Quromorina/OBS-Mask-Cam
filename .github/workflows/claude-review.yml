name: Claude Code Review

# PRが開かれたとき・Draftからレビュー可能にしたときに、Claudeが自動でレビューする。
# 認証は Claude Max のサブスクリプション（secrets.CLAUDE_CODE_OAUTH_TOKEN）。
# push のたびには動かさない（利用枠の節約）。再レビューしたいときはPRを一度閉じて開き直す。

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    # Draft と Dependabot などのBotのPRは対象外
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    # ジョブ単位で排他（スキップされた実行が、動くべき実行を打ち消さないように）
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューしてください。コメントはすべて日本語で書いてください。

            重点：
            1. 動作の不具合・境界条件・エラー処理の漏れ
            2. セキュリティ（秘密情報の混入、入力の検証、権限）
            3. 運用手順の誤り（README・設定ファイル・Docker/compose・CI。書かれた手順どおりに実行して失敗しないか）
            4. テストが変更を十分に確かめているか

            進め方：
            - 具体的な問題は、該当行にインラインコメントで書く。重要度（高・中・低）と、どう直すかを添える。
            - 好みの問題や細かすぎる指摘は書かない。
            - 最後に必ず `gh pr comment` でまとめを1件投稿する。問題がなければ「指摘なし」と書く。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
